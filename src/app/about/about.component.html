<section class="max-w-3xl mx-auto text-left" aria-labelledby="about-title">
  <div class="bg-white rounded-xl shadow-md p-6 sm:p-8">
    <h2 id="about-title" class="text-3xl font-bold text-gray-800 mb-6">{{ about().title }}</h2>
    <p class="text-xl font-medium text-indigo-700 mb-4">{{ about().intro }}</p>
    <p class="text-gray-600 leading-relaxed">{{ about().description }}</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6">
    @for (interest of about().interests; track interest.title) {
      <div class="bg-white rounded-xl shadow-md p-6 border-t-4 border-indigo-500">
        <h3 class="text-lg font-semibold text-gray-800 mb-3">{{ interest.title }}</h3>
        <p class="text-gray-600 leading-relaxed">{{ interest.text }}</p>
      </div>
    }
  </div>
</section>
